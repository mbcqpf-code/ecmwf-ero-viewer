name: Update ECMWF IFS ERO Viewer

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Cartopy NaturalEarth shapefiles
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-shapefiles-v1

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libgeos-dev libproj-dev proj-bin
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ECMWF IFS ERO generator
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python generate_ifs_ero_viewer.py

      - name: Commit and push updated docs/ to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "Update IFS ERO graphics (${{ github.run_number }})"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new graphics to commit."
          fi
