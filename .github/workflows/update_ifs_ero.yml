name: Update ECMWF IFS ERO Viewer

on:
  schedule:
    # Runs every 2 hours at minute 15 (00:15, 02:15, 04:15, ... UTC)
    - cron: '15 */2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Restore existing gh-pages cache (output/runs)
        run: |
          git fetch origin gh-pages || true
          mkdir -p output
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C output
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Cartopy NaturalEarth shapefiles
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-shapefiles-v1

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev libgeos-dev libproj-dev proj-bin
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ECMWF IFS ERO generator
        run: |
          python generate_ifs_ero_viewer.py

      - name: Deploy output/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
          commit_message: "Update IFS ERO graphics (${{ github.run_number }})"
